<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Accessible Form</title>
  </head>
  <body>
    <div class="form-card">
      <form>
        <div>
          <label for="full-name">Full Name</label>
          <input id="full-name" name="full-name" type="text" placeholder="What should we call you?" required aria-required="true"
        </div>
        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" aria-describedby="email-error" aria-invalid="true" placeholder="yourname@internet.com" required aria-required="true"
          <p id="email-error" class="error">Email is already taken</p>
        </div>
        <div class="password-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="xxxxxx" required aria-required="true"
          <button type="button" aria-label="Show password">👁</button>
        </div>
                <div class="password-field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="xxxxxx" required aria-required="true"
          <button type="button" aria-label="Confirm Password">👁</button>
        </div>
          <div class="password-field">
  <label for="password">Enter Password</label>
  <input id="password" name="password" type="password" placeholder="xxxxxxxx" required aria-required="true">
  <button type="button" aria-label="Show password" aria-pressed="false">👁</button>
</div>

        <button type="submit">Update Profile</button>
      </form>
      <aside>
        <h2>Profile Completeness</h2>
        <div class="progress-circle" role="progressbar" aria-valuenow="65" aria-valuemin="0" aria-valuemax="100">65%</div>
        <ul>
          <li class="done">Create Account</li>
          <li class="done">Update Roadmap Progress</li>
          <li class="done">Setup Public Profile</li>
          <li>Complete Your First Project</li>
          <li>Invite Your Friends</li>
        </ul>
      </aside>
    </div>
  </body>
</html>
